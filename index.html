<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ff7a3d">
<meta name="color-scheme" content="light dark">
<title>关于土豆的计划</title>

<!-- 引入 Supabase SDK -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
(function(){
  try{
    var s = localStorage.getItem('potato-theme');
    var d = s === 'dark' || s === 'light'
      ? s
      : (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    document.documentElement.setAttribute('data-theme', d);
  }catch(e){}
})();
</script>
<style>
  :root{
    --bg:#f2f4fa; --card:#fff; --text:#151a26; --muted:#5f6779; --line:#e6e9f1;
    --doing:#2463e8; --doing-bg:#e4edff;
    --urgent:#d8451f; --urgent-bg:#ffe9e1;
    --todo:#7b8496; --todo-bg:#eef0f5;
    --done:#158a56; --done-bg:#e2f6ec;
    --shadow:0 6px 22px rgba(20,30,60,.09);
    --radius:18px;
    --t:420ms cubic-bezier(.4,0,.2,1);
  }
  :root[data-theme="dark"]{
    --bg:#0b0e14; --card:#161a22; --text:#f0f3f9; --muted:#9aa3b4; --line:#252b37;
    --doing:#7aabff; --doing-bg:#1a2745;
    --urgent:#ff9870; --urgent-bg:#33190f;
    --todo:#a6afbf; --todo-bg:#20252f;
    --done:#54dda2; --done-bg:#0f2b1f;
    --shadow:0 6px 22px rgba(0,0,0,.5);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{-webkit-text-size-adjust:100%;background:var(--bg);color-scheme:light;transition:background-color var(--t)}
  html[data-theme="dark"]{color-scheme:dark}
  body{
    margin:0;font-size:16px;
    padding:calc(12px + env(safe-area-inset-top)) calc(12px + env(safe-area-inset-right)) calc(36px + env(safe-area-inset-bottom)) calc(12px + env(safe-area-inset-left));
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    background:var(--bg);color:var(--text);line-height:1.65;touch-action:manipulation;
    transition:background-color var(--t),color var(--t);
  }
  body.edit-mode{padding-top:calc(64px + env(safe-area-inset-top))}
  .wrap{width:100%;max-width:600px;margin:0 auto}
  
  /* 同步状态 */
  .sync-status{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:700;color:rgba(255,255,255,.9);cursor:pointer;padding:4px 8px;border-radius:8px;background:rgba(255,255,255,.15);transition:background .2s;position:absolute;top:16px;right:90px;z-index:3;}
  .sync-status:active{background:rgba(255,255,255,.3);}
  .sync-dot{width:6px;height:6px;border-radius:50%;background:#94a3b8;transition:background .2s;}
  .sync-status.syncing .sync-dot{background:#fbbf24;animation:blink 1s infinite;}
  .sync-status.synced .sync-dot{background:#34d399;}
  .sync-status.error .sync-dot{background:#f87171;}
  .sync-status.local .sync-dot{background:#cbd5e1;}
  @keyframes blink{0%,100%{opacity:1}50%{opacity:.35}}

  .hero{position:relative;overflow:hidden;padding:22px 20px 18px;border-radius:var(--radius);color:#fff;
    background:linear-gradient(135deg,#ffb038 0%,#ff7a3d 55%,#ff5f6d 100%);
    box-shadow:0 12px 30px rgba(255,122,61,.32);animation:up .5s ease both;
    transition:box-shadow var(--t)}
  .hero::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:0;
    background:linear-gradient(135deg,#c1791d 0%,#b34d20 55%,#a8363d 100%);
    transition:opacity var(--t)}
  :root[data-theme="dark"] .hero::before{opacity:1}
  :root[data-theme="dark"] .hero{box-shadow:0 12px 30px rgba(0,0,0,.55)}
  .hero::after{content:"";position:absolute;width:230px;height:230px;border-radius:50%;
    background:rgba(255,255,255,.15);top:-120px;right:-80px;pointer-events:none}
  .hero h1,.hero .date,.hero .progress,.hero .stats,.hero .status-pill,.hero .status-note{position:relative;z-index:1}
  .hero h1{margin:0;font-size:26px;font-weight:800;letter-spacing:.5px;line-height:1.3;padding-right:68px}
  .hero .date{margin:6px 0 0;font-size:13.5px;font-weight:500;opacity:.95}
  .theme-toggle{position:absolute;top:16px;right:16px;z-index:3;width:60px;height:32px;padding:0;border:0;border-radius:999px;
    background:rgba(255,255,255,.3);box-shadow:inset 0 1px 2px rgba(0,0,0,.12);
    -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);cursor:pointer;
    transition:background-color var(--t),transform .12s cubic-bezier(.4,0,.2,1)}
  .theme-toggle:active{transform:scale(.95)}
  :root[data-theme="dark"] .theme-toggle{background:rgba(0,0,0,.32)}
  .tk-knob{position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;
    box-shadow:0 1px 3px rgba(0,0,0,.26),inset 0 1px 0 rgba(255,255,255,.9);
    display:flex;align-items:center;justify-content:center;will-change:transform;
    transition:transform .4s cubic-bezier(.34,1.3,.64,1),background-color var(--t),box-shadow var(--t)}
  :root[data-theme="dark"] .tk-knob{transform:translateX(28px);background:#3d4252;box-shadow:0 1px 3px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.14)}
  .tk-icon{position:absolute;width:15px;height:15px}
  .tk-icon svg{width:100%;height:100%;display:block}
  .tk-sun{color:#f59e0b;opacity:1;transform:rotate(0) scale(1);transition:opacity 220ms ease,transform 360ms cubic-bezier(.34,1.3,.64,1)}
  .tk-moon{color:#cfd3e0;opacity:0;transform:rotate(-90deg) scale(.4);transition:opacity 220ms ease,transform 360ms cubic-bezier(.34,1.3,.64,1)}
  :root[data-theme="dark"] .tk-sun{opacity:0;transform:rotate(90deg) scale(.4)}
  :root[data-theme="dark"] .tk-moon{opacity:1;transform:rotate(0) scale(1)}
  .progress{margin-top:16px;height:9px;border-radius:99px;background:rgba(255,255,255,.32);overflow:hidden}
  .progress > i{display:block;height:100%;width:0;border-radius:99px;background:#fff;transition:width 1.1s cubic-bezier(.2,.8,.2,1)}
  .status-pill{display:inline-flex;align-items:center;gap:7px;margin-top:14px;padding:6px 14px;border-radius:99px;
    background:rgba(255,255,255,.26);font-size:13.5px;font-weight:700;color:#fff;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
  .status-dot{width:8px;height:8px;border-radius:50%;background:#3ddc84;flex:0 0 auto;animation:blink 2s infinite}
  .status-pill.updating .status-dot{background:#ffd24a}
  .status-pill.maintenance .status-dot{background:#ff6b6b}
  .status-note{margin:8px 0 0;font-size:12.5px;font-weight:600;opacity:.9}
  .stats{display:flex;gap:9px;margin-top:14px;flex-wrap:wrap}
  .stat{font:inherit;display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:700;
    min-height:44px;padding:7px 15px;border-radius:99px;border:0;background:rgba(255,255,255,.26);color:#fff;
    white-space:nowrap;cursor:pointer;transition:background-color .2s,transform .12s ease}
  .stat:active{transform:scale(.95);background:rgba(255,255,255,.42)}
  @media (hover:hover) and (pointer:fine){.stat:hover{background:rgba(255,255,255,.38)}}
  .stat .arrow{font-size:12px;line-height:1;opacity:.85;transition:transform .2s ease}
  .stat:active .arrow{transform:translateX(2px)}
  .toolbar{display:flex;justify-content:flex-end;margin:14px 2px 0}
  .toolbar button{font:inherit;font-size:14px;font-weight:700;min-height:44px;padding:0 20px;border-radius:99px;cursor:pointer;
    color:var(--text);background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow);
    transition:transform .12s ease,background-color var(--t),border-color var(--t),color var(--t),box-shadow var(--t)}
  .toolbar button:active{transform:scale(.96)}
  .card{background-color:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    padding:12px 14px 6px;margin-top:14px;box-shadow:var(--shadow);animation:up .5s ease both;
    transition:background-color var(--t),border-color var(--t),box-shadow var(--t),color var(--t)}
  .card.doing{--accent:var(--doing);--accent-bg:var(--doing-bg)}
  .card.urgent{--accent:var(--urgent);--accent-bg:var(--urgent-bg)}
  .card.todo{--accent:var(--todo);--accent-bg:var(--todo-bg)}
  .card.done{--accent:var(--done);--accent-bg:var(--done-bg)}
  .card.info{--accent:var(--todo);--accent-bg:var(--todo-bg)}
  .card-head{display:flex;align-items:center;gap:10px;padding:6px 2px 8px}
  .bar{width:5px;height:20px;border-radius:99px;background:var(--accent);flex:0 0 auto;transition:background-color var(--t)}
  .card-head h2{margin:0;font-size:18px;font-weight:800;letter-spacing:.4px;color:var(--accent);transition:color var(--t)}
  .count{margin-left:auto;font-size:12.5px;font-weight:600;color:var(--muted);white-space:nowrap;transition:color var(--t)}
  .card.feedback-top{--accent:#fff;--accent-bg:rgba(255,255,255,.2);color:#fff;padding:20px 18px 20px;border:0;
    background-color:transparent;background-image:linear-gradient(135deg,#ff8a2b 0%,#ff5f45 55%,#ff3d6e 100%);
    box-shadow:0 14px 34px rgba(255,95,69,.38);position:relative;overflow:hidden;
    transition:box-shadow var(--t),background-color var(--t),border-color var(--t),color var(--t)}
  .card.feedback-top::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:0;
    background-image:linear-gradient(135deg,#e07a1f 0%,#d94b32 55%,#d62f5c 100%);
    transition:opacity var(--t)}
  :root[data-theme="dark"] .card.feedback-top::before{opacity:1}
  :root[data-theme="dark"] .card.feedback-top{box-shadow:0 14px 34px rgba(0,0,0,.6)}
  .card.feedback-top::after{content:"";position:absolute;width:200px;height:200px;border-radius:50%;
    background:rgba(255,255,255,.12);top:-100px;right:-70px;pointer-events:none}
  .card.feedback-top .card-head{padding:0 0 6px;position:relative;z-index:1}
  .card.feedback-top .bar{background:#fff}
  .card.feedback-top .card-head h2{font-size:21px;font-weight:800;color:#fff;letter-spacing:.6px}
  .pin-badge{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:800;letter-spacing:.8px;
    color:#ff5f45;background:#fff;padding:3px 11px;border-radius:99px;margin-left:auto;
    box-shadow:0 2px 8px rgba(0,0,0,.15);transition:color var(--t)}
  :root[data-theme="dark"] .pin-badge{color:#c8381e}
  .pin-dot{width:7px;height:7px;border-radius:50%;background:#ff5f45;box-shadow:0 0 0 0 rgba(255,95,69,.6);animation:pulse 2.2s infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,95,69,.6)}70%{box-shadow:0 0 0 9px rgba(255,95,69,0)}100%{box-shadow:0 0 0 0 rgba(255,95,69,0)}}
  .fb-lead{margin:10px 0 12px;font-size:16.5px;font-weight:600;line-height:1.6;color:#fff;position:relative;z-index:1}
  .fb-lead b{font-weight:800;border-bottom:2.5px solid rgba(255,255,255,.85);padding-bottom:1px}
  .fb-steps{margin:0;padding:0;list-style:none;counter-reset:fb;position:relative;z-index:1}
  .fb-steps li{counter-increment:fb;position:relative;padding:12px 0 12px 42px;font-size:16.5px;font-weight:600;
    line-height:1.55;border-top:1.5px solid rgba(255,255,255,.28);word-break:break-word;color:#fff}
  .fb-steps li:first-child{border-top:0;padding-top:6px}
  .fb-steps li::before{content:counter(fb);position:absolute;left:0;top:14px;width:28px;height:28px;border-radius:50%;
    background:#fff;color:#ff5f45;font-size:14px;font-weight:800;display:flex;align-items:center;justify-content:center;
    box-shadow:0 2px 8px rgba(0,0,0,.18)}
  .fb-steps li:first-child::before{top:8px}
  .fb-key{display:inline-block;background:#fff;color:#e8482c;font-weight:800;padding:2px 10px;border-radius:8px;
    white-space:nowrap;box-shadow:0 2px 8px rgba(0,0,0,.14)}
  .fb-steps li b{font-weight:800}
  .fb-note{margin:14px 0 0;padding:14px 16px;border-radius:12px;background:rgba(255,255,255,.22);
    font-size:16px;line-height:1.6;font-weight:700;color:#fff;position:relative;z-index:1;
    -webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
  .fb-copy{margin-top:12px;position:relative;z-index:1}
  .fb-copy button{font:inherit;font-size:14px;font-weight:800;padding:10px 18px;border-radius:99px;border:0;cursor:pointer;
    background:#fff;color:#e8482c;box-shadow:0 4px 14px rgba(0,0,0,.18);transition:transform .12s ease}
  .fb-copy button:active{transform:scale(.96)}
  .item-wrap{border-top:1px solid var(--line);transition:border-color var(--t)}
  .item-wrap:first-of-type{border-top:none}
  .item{width:100%;display:flex;align-items:center;gap:12px;background:none;border:0;border-radius:12px;
    padding:14px 8px;min-height:54px;font:inherit;color:var(--text);text-align:left;cursor:pointer;
    user-select:none;-webkit-user-select:none;
    transition:background-color .2s cubic-bezier(.4,0,.2,1),transform .12s ease,color var(--t)}
  .item:active{background:var(--accent-bg);transform:scale(.99)}
  @media (hover:hover) and (pointer:fine){.item:hover{background:var(--accent-bg)}}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--accent);flex:0 0 auto;transition:background-color var(--t)}
  .txt{flex:1;font-size:16px;font-weight:600;line-height:1.5;word-break:break-word}
  .badge{font-size:12px;padding:3px 10px;border-radius:99px;white-space:nowrap;font-weight:700;flex:0 0 auto;
    transition:color var(--t),background-color var(--t)}
  .badge.doing{color:var(--doing);background:var(--doing-bg)}
  .badge.todo{color:var(--todo);background:var(--todo-bg)}
  .badge.done{color:var(--done);background:var(--done-bg)}
  .chev{color:var(--muted);font-size:17px;line-height:1;flex:0 0 auto;transition:transform .3s cubic-bezier(.2,.8,.2,1),color var(--t)}
  .item-wrap.open .chev{transform:rotate(90deg)}
  .detail{display:grid;grid-template-rows:0fr;transition:grid-template-rows .35s cubic-bezier(.2,.8,.2,1)}
  .detail > div{overflow:hidden}
  .item-wrap.open .detail{grid-template-rows:1fr}
  .detail p{margin:0 0 14px;padding:0 8px 0 28px;font-size:14.5px;line-height:1.65;color:var(--muted);font-weight:500;transition:color var(--t)}
  .detail p.task-date{font-size:12.5px;font-weight:700;color:var(--done);margin-top:-8px}
  .row-actions{display:flex;gap:6px;padding:0 8px 10px 28px;flex-wrap:wrap}
  .row-actions button{font:inherit;font-size:12px;font-weight:700;padding:5px 12px;border-radius:8px;cursor:pointer;
    border:1px solid var(--line);background:var(--card);color:var(--muted);transition:color .2s,border-color .2s,transform .12s}
  .row-actions button:active{transform:scale(.95)}
  .row-actions button.danger{color:var(--urgent);border-color:var(--urgent)}
  .row-actions .sep{margin-left:auto}
  .info-body p{margin:8px 0 14px;font-size:15px;line-height:1.7;padding:0 4px;font-weight:500;transition:color var(--t)}
  .info-body b{color:var(--accent);font-weight:800;transition:color var(--t)}
  footer{text-align:center;font-size:13px;font-weight:600;color:var(--muted);margin-top:22px;padding:0 8px;line-height:1.7;transition:color var(--t)}
  @keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  .card:nth-of-type(1){animation-delay:.04s}
  .card:nth-of-type(2){animation-delay:.1s}
  .card:nth-of-type(3){animation-delay:.16s}
  .card:nth-of-type(4){animation-delay:.22s}
  .card:nth-of-type(5){animation-delay:.28s}
  .card:nth-of-type(6){animation-delay:.34s}
  .modal-mask{position:fixed;inset:0;z-index:50;display:none;align-items:flex-end;justify-content:center;
    background:rgba(10,14,22,.5);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);
    opacity:0;transition:opacity .28s ease;padding:0}
  .modal-mask.show{display:flex}
  .modal-mask.in{opacity:1}
  .modal{width:100%;max-width:600px;max-height:82vh;display:flex;flex-direction:column;background:var(--card);
    border-radius:22px 22px 0 0;box-shadow:0 -8px 40px rgba(0,0,0,.3);padding-bottom:env(safe-area-inset-bottom);
    transform:translateY(100%);transition:transform .34s cubic-bezier(.22,.9,.28,1),background-color var(--t),color var(--t);
    --mc:var(--todo);--mc-bg:var(--todo-bg)}
  .modal-mask.in .modal{transform:translateY(0)}
  .modal.done{--mc:var(--done);--mc-bg:var(--done-bg)}
  .modal.doing{--mc:var(--doing);--mc-bg:var(--doing-bg)}
  .modal-head{display:flex;align-items:center;gap:12px;padding:18px 20px 14px;border-bottom:1px solid var(--line);transition:border-color var(--t)}
  .modal-head .mbar{width:5px;height:22px;border-radius:99px;background:var(--mc);transition:background-color var(--t)}
  .modal-head h3{margin:0;font-size:19px;font-weight:800;color:var(--mc);transition:color var(--t)}
  .modal-head .mnum{font-size:13px;font-weight:700;color:var(--mc);background:var(--mc-bg);padding:3px 11px;border-radius:99px;
    transition:color var(--t),background-color var(--t)}
  .modal-close{margin-left:auto;flex:0 0 auto;width:38px;height:38px;border-radius:50%;border:0;background:var(--todo-bg);color:var(--muted);
    font-size:17px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background-color var(--t),color var(--t),transform .12s}
  .modal-close:active{transform:scale(.92)}
  :root[data-theme="dark"] .modal-close{background:#232833}
  .modal-body{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:10px 16px 20px;overscroll-behavior:contain}
  .m-item{display:flex;gap:12px;align-items:flex-start;padding:15px 10px;border-radius:12px;border-bottom:1px solid var(--line);transition:border-color var(--t)}
  .m-item:last-child{border-bottom:0}
  .m-dot{width:8px;height:8px;border-radius:50%;background:var(--mc);margin-top:9px;flex:0 0 auto;transition:background-color var(--t)}
  .m-text{display:flex;flex-direction:column;gap:5px;min-width:0}
  .m-title{font-size:16.5px;font-weight:600;line-height:1.5;word-break:break-word;transition:color var(--t)}
  .m-cat{font-size:12px;font-weight:700;color:var(--mc);background:var(--mc-bg);align-self:flex-start;padding:2px 10px;border-radius:99px;
    transition:color var(--t),background-color var(--t)}
  .m-empty{text-align:center;color:var(--muted);font-size:15.5px;font-weight:600;padding:40px 10px 34px;transition:color var(--t)}
  .m-empty .emo{display:block;font-size:30px;margin-bottom:10px;opacity:.75}
  .edit-bar{position:fixed;top:0;left:0;right:0;z-index:60;display:flex;gap:8px;align-items:center;
    padding:calc(9px + env(safe-area-inset-top)) 12px 9px;background:#1f2430;color:#fff;font-size:13px;
    overflow-x:auto;white-space:nowrap;box-shadow:0 4px 18px rgba(0,0,0,.3);-webkit-overflow-scrolling:touch}
  .edit-bar::-webkit-scrollbar{display:none}
  .edit-bar .edit-tag{font-weight:800;letter-spacing:.5px;color:#ffd24a;flex:0 0 auto}
  .edit-bar button{font:inherit;font-size:13px;font-weight:700;padding:8px 14px;border-radius:99px;border:0;
    background:rgba(255,255,255,.14);color:#fff;cursor:pointer;flex:0 0 auto;transition:transform .12s}
  .edit-bar button:active{transform:scale(.95)}
  .edit-bar button.primary{background:#ff7a3d}
  .edit-bar button.exit{background:rgba(255,107,107,.24);color:#ffb3b3}
  .editor-mask{position:fixed;inset:0;z-index:70;display:none;align-items:center;justify-content:center;padding:16px;
    background:rgba(10,14,22,.58);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
  .editor-mask.show{display:flex}
  .editor{width:100%;max-width:540px;max-height:88vh;overflow-y:auto;background:var(--card);color:var(--text);
    border-radius:18px;box-shadow:0 20px 60px rgba(0,0,0,.4);padding:20px;overscroll-behavior:contain}
  .editor h3{margin:0 0 14px;font-size:19px;font-weight:800}
  .editor label{display:block;margin-bottom:12px;font-size:13px;font-weight:700;color:var(--muted)}
  .editor input,.editor textarea,.editor select{display:block;width:100%;margin-top:5px;font:inherit;font-size:14px;
    padding:9px 11px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--text);transition:border-color .2s}
  .editor input:focus,.editor textarea:focus,.editor select:focus{outline:none;border-color:#ff7a3d}
  .editor textarea{min-height:72px;resize:vertical;line-height:1.5}
  .editor .hint{font-size:12px;color:var(--muted);margin:-6px 0 12px;font-weight:500}
  .editor .fieldset{border-top:1px solid var(--line);margin-top:16px;padding-top:14px}
  .editor .fieldset-title{font-size:13px;font-weight:800;color:var(--text);margin-bottom:10px;letter-spacing:.3px}

<script>
(function(){
  // ================= 已经为你自动填好 Supabase 配置 =================
  const SUPABASE_URL = 'https://llougurgeejac.supabase.co'; 
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imxsb3VndXJnZWVqYWV0aGRnZGJiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTMzODg2NjMsImV4cCI6MjEwODk2NDY2M30.FKeiYQhh22M-PRLUWZiwY3bLeg8atYDhQfx9p5EqyRs';
  // ===============================================================

  const CONFIG = { adminPassword: 'potato2026' };
  const root = document.documentElement;
  const app = document.getElementById('app');
  const editorMask = document.getElementById('editorMask');
  const editorBody = document.getElementById('editorBody');
  
  let editMode = false;
  let data = null;
  let supabase = null;
  let pushTimer = null;

  if (window.supabase) {
    supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  }

  var LABEL = { done: '已完成', doing: '正在完成', todo: '未完成' };
  var EMPTY = { done: '暂无已完成任务', doing: '暂无正在完成的任务', todo: '暂无未完成任务' };

  function esc(s){
    return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
      return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c];
    });
  }
  function clone(o){ return JSON.parse(JSON.stringify(o)); }
  function uid(){ return 't' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }

  // 主题
  var toggleBtn = null;
  var metaTheme = document.querySelector('meta[name="theme-color"]');
  function setTheme(t, save){
    root.setAttribute('data-theme', t);
    if(toggleBtn) toggleBtn.setAttribute('aria-pressed', t === 'dark' ? 'true' : 'false');
    if(metaTheme) metaTheme.setAttribute('content', t === 'dark' ? '#0b0e14' : '#ff7a3d');
    if(save){ try{ localStorage.setItem('potato-theme', t); }catch(e){} }
  }
  var savedTheme = null;
  try{ savedTheme = localStorage.getItem('potato-theme'); }catch(e){}
  if(!savedTheme && window.matchMedia){
    var mq = window.matchMedia('(prefers-color-scheme: dark)');
    var onSys = function(e){ setTheme(e.matches ? 'dark' : 'light', false); };
    if(mq.addEventListener) mq.addEventListener('change', onSys);
    else if(mq.addListener) mq.addListener(onSys);
  }
  setTheme(root.getAttribute('data-theme') === 'dark' ? 'dark' : 'light', false);

  // ================= 同步状态 UI =================
  function setSyncStatus(type, errMsg) {
    const el = document.getElementById('syncStatus'); 
    if(!el) return;
    const txt = el.querySelector('.sync-text');
    el.className = 'sync-status ' + type;
    const labels = { local:'本地模式', idle:'点击同步', syncing:'同步中…', synced:'已同步云端', error:'同步失败' };
    txt.textContent = labels[type] || type;
  }

  function toast(msg){
    var d = document.createElement('div');
    d.textContent = msg;
    d.style.cssText = 'position:fixed;left:50%;bottom:32px;transform:translateX(-50%);background:#1f2430;color:#fff;padding:10px 20px;border-radius:99px;font-size:14px;font-weight:700;z-index:99;box-shadow:0 6px 20px rgba(0,0,0,.3);transition:opacity .3s';
    document.body.appendChild(d);
    setTimeout(function(){ d.style.opacity = '0'; }, 1600);
    setTimeout(function(){ d.remove(); }, 2000);
  }

  // ================= 云端同步逻辑 =================
  async function initCloud() {
    if(!supabase) { setSyncStatus('local'); return; }
    setSyncStatus('idle');
    await pullFromCloud();
    subscribeRealtime();
  }

  async function pullFromCloud() {
    if (!supabase) return;
    setSyncStatus('syncing');
    try {
      const { data: res, error } = await supabase
        .from('potato_state')
        .select('data, updated_at')
        .eq('id', 'default')
        .maybeSingle();
      
      if (error) throw error;

      if (!res || !res.data) {
        // 云端没数据，把本地推上去
        await pushNow();
        return;
      }

      const cloudTime = new Date(res.updated_at).getTime();
      const localTime = data._localUpdatedAt || 0;

      if (cloudTime > localTime + 1000) {
        data = res.data;
        data._localUpdatedAt = cloudTime;
        if (!editMode) render();
        toast('已自动同步云端最新数据');
      } else if (localTime > cloudTime + 1000) {
        await pushNow();
      }
      setSyncStatus('synced');
    } catch (e) {
      setSyncStatus('error');
    }
  }

  function pushToCloud() {
    if (!supabase) return;
    clearTimeout(pushTimer);
    pushTimer = setTimeout(pushNow, 700);
  }

  async function pushNow() {
    if (!supabase) return toast('未配置云端，无法保存');
    setSyncStatus('syncing');
    try {
      data._localUpdatedAt = Date.now();
      const { error } = await supabase
        .from('potato_state')
        .upsert({ id: 'default', data: data, updated_at: new Date().toISOString() });
      
      if (error) throw error;
      setSyncStatus('synced');
      toast('✅ 已保存到云端');
    } catch (e) {
      setSyncStatus('error');
      toast('保存失败：' + e.message);
    }
  }

  function subscribeRealtime() {
    if (!supabase || editMode) return;
    supabase.channel('public:potato_state')
      .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'potato_state' }, payload => {
        if (payload.new && payload.new.data) {
          const cloudTime = new Date(payload.new.updated_at).getTime();
          if (cloudTime > (data._localUpdatedAt || 0)) {
            data = payload.new.data;
            data._localUpdatedAt = cloudTime;
            render();
            toast('🔄 页面已自动更新');
          }
        }
      })
      .subscribe();
  }

  // ================= 渲染 =================
  function currentStatusCount(){
    var c = { done:0, doing:0, todo:0 };
    data.tasks.forEach(function(t){ if(c[t.status] != null) c[t.status]++; });
    return c;
  }
  function statusOfTask(t){
    if(t.status === 'done') return 'done';
    if(t.status === 'doing') return 'doing';
    return 'todo';
  }

  function render(){
    document.body.classList.toggle('edit-mode', editMode);
    var c = currentStatusCount();
    var total = data.tasks.length;
    var pct = total ? Math.round(c.done / total * 100) : 0;

    var html = '';

    if(editMode){
      html += '<div class="edit-bar" id="editBar">'
        + '<span class="edit-tag">编辑模式</span>'
        + '<button class="primary" data-act="add-task">＋ 添加任务</button>'
        + '<button data-act="edit-page">页面信息</button>'
        + '<button data-act="save-cloud" style="background:#158a56">☁️ 保存到云端</button>'
        + '<button class="exit" data-act="exit-edit">退出</button>'
        + '</div>';
    }

    html += '<div class="wrap">';

    html += '<header class="hero">'
      + '<div class="sync-status local" id="syncStatus" title="点击立即同步" onclick="window.pullManual()">'
      +   '<span class="sync-dot"></span>'
      +   '<span class="sync-text">本地模式</span>'
      + '</div>'
      + '<button class="theme-toggle" type="button" id="themeToggle" aria-label="切换深色/浅色模式" aria-pressed="' + (root.getAttribute('data-theme') === 'dark' ? 'true' : 'false') + '">'
      +   '<span class="tk-knob">'
      +     '<span class="tk-icon tk-sun" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4"/></svg></span>'
      +     '<span class="tk-icon tk-moon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></span>'
      +   '</span>'
      + '</button>'
      + '<h1>' + esc(data.meta.title) + '</h1>'
      + '<p class="date">' + esc(data.meta.date) + '</p>'
      + '<div class="status-pill ' + esc(data.meta.serverStatus) + '"><span class="status-dot"></span><span>' + esc(data.meta.serverStatusText) + '</span></div>'
      + (data.meta.serverStatusNote ? '<p class="status-note">' + esc(data.meta.serverStatusNote) + '</p>' : '')
      + '<div class="progress"><i id="fill"></i></div>'
      + '<div class="stats">'
      +   '<button class="stat" type="button" data-filter="done"><span>已完成 ' + c.done + '</span><span class="arrow" aria-hidden="true">›</span></button>'
      +   '<button class="stat" type="button" data-filter="doing"><span>正在完成 ' + c.doing + '</span><span class="arrow" aria-hidden="true">›</span></button>'
      +   '<button class="stat" type="button" data-filter="todo"><span>未完成 ' + c.todo + '</span><span class="arrow" aria-hidden="true">›</span></button>'
      + '</div>'
      + '</header>';

    var fb = data.feedback;
    html += '<section class="card feedback-top">'
      + '<div class="card-head"><span class="bar"></span><h2>' + esc(fb.title) + '</h2>'
      + (fb.badge ? '<span class="pin-badge"><span class="pin-dot"></span>' + esc(fb.badge) + '</span>' : '')
      + '</div>'
      + '<p class="fb-lead">' + fb.lead + '</p>'
      + '<ol class="fb-steps">' + fb.steps.map(function(s){ return '<li>' + s + '</li>'; }).join('') + '</ol>'
      + (fb.note ? '<p class="fb-note">' + esc(fb.note) + '</p>' : '')
      + '<div class="fb-copy"><button type="button" data-act="copy-template">复制反馈模板</button></div>'
      + '</section>';

    html += '<div class="toolbar"><button id="toggleAll" type="button">全部展开</button></div>';

    data.sections.forEach(function(sec){
      var list = data.tasks.filter(function(t){ return t.section === sec.id; });
      html += '<section class="card ' + esc(sec.accent) + '">'
        + '<div class="card-head"><span class="bar"></span><h2>' + esc(sec.name) + '</h2>'
        + (sec.count ? '<span class="count">' + esc(sec.count) + '</span>' : '')
        + '</div>'
        + list.map(function(t){ return taskHTML(t); }).join('')
        + '</section>';
    });

    html += '<section class="card info">'
      + '<div class="card-head"><span class="bar"></span><h2>' + esc(data.info.title) + '</h2></div>'
      + '<div class="info-body">'
      + data.info.items.map(function(it){ return '<p><b>' + esc(it.h) + '</b><br>' + esc(it.p) + '</p>'; }).join('')
      + '</div></section>';

    html += '<footer>' + esc(data.meta.footer) + '</footer>';
    html += '</div>';

    app.innerHTML = html;

    toggleBtn = document.getElementById('themeToggle');
    if(toggleBtn){
      toggleBtn.addEventListener('click', function(){
        setTheme(root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark', true);
      });
    }

    requestAnimationFrame(function(){
      var fill = document.getElementById('fill');
      if(fill) fill.style.width = pct + '%';
    });

    // 初始化状态
    if(supabase) setSyncStatus('synced');
    else setSyncStatus('local');
  }

  function taskHTML(t){
    var st = statusOfTask(t);
    var badgeText = t.badge || LABEL[st];
    return '<div class="item-wrap" data-id="' + esc(t.id) + '">'
      + '<button class="item" type="button">'
      +   '<span class="dot"></span>'
      +   '<span class="txt">' + esc(t.title) + '</span>'
      +   '<span class="badge ' + st + '">' + esc(badgeText) + '</span>'
      +   '<span class="chev">›</span>'
      + '</button>'
      + '<div class="detail"><div>'
      +   '<p>' + esc(t.desc) + '</p>'
      +   (t.date ? '<p class="task-date">完成于 ' + esc(t.date) + '</p>' : '')
      + '</div></div>'
      + (editMode ? '<div class="row-actions">'
      +   '<button data-act="edit-task" data-id="' + esc(t.id) + '">编辑</button>'
      +   '<button data-act="del-task" data-id="' + esc(t.id) + '" class="danger">删除</button>'
      +   '<button class="sep" data-act="move-up" data-id="' + esc(t.id) + '">↑ 上移</button>'
      +   '<button data-act="move-down" data-id="' + esc(t.id) + '">↓ 下移</button>'
      + '</div>' : '')
      + '</div>';
  }

  // 暴露手动同步给 HTML 按钮
  window.pullManual = async function() {
    if(!supabase) return toast('当前为本地模式');
    await pullFromCloud();
    if(document.getElementById('syncStatus').classList.contains('synced')) toast('同步成功');
  }

  // ================= 事件绑定 =================
  app.addEventListener('click', function(e){
    var el = e.target.closest('[data-act]');
    if(el){
      var act = el.getAttribute('data-act');
      var id = el.getAttribute('data-id');
      if(act === 'add-task') return openTaskEditor(null);
      if(act === 'edit-task') return openTaskEditor(id);
      if(act === 'del-task') return deleteTask(id);
      if(act === 'move-up') return moveTask(id, -1);
      if(act === 'move-down') return moveTask(id, 1);
      if(act === 'edit-page') return openPageEditor();
      if(act === 'save-cloud') return pushNow(); // 手动保存
      if(act === 'exit-edit') return exitEdit();
      if(act === 'copy-template') return copyTemplate();
      return;
    }
    var filter = e.target.closest('[data-filter]');
    if(filter) return openModal(filter.getAttribute('data-filter'));
    var item = e.target.closest('.item');
    if(item){
      var wrap = item.closest('.item-wrap');
      if(wrap) wrap.classList.toggle('open');
      return;
    }
    var all = e.target.closest('#toggleAll');
    if(all){
      var wraps = Array.prototype.slice.call(document.querySelectorAll('.item-wrap'));
      var shouldOpen = wraps.some(function(w){ return !w.classList.contains('open'); });
      wraps.forEach(function(w){ w.classList.toggle('open', shouldOpen); });
      all.textContent = shouldOpen ? '全部收起' : '全部展开';
    }
  });

  // ================= 任务增删改操作 =================
  function deleteTask(id){
    var t = data.tasks.find(function(x){ return x.id === id; });
    if(!t) return;
    if(!confirm('确定删除任务「' + t.title + '」？')) return;
    data.tasks = data.tasks.filter(function(x){ return x.id !== id; });
    render();
    pushToCloud(); // 自动同步
  }
  function moveTask(id, dir){
    var t = data.tasks.find(function(x){ return x.id === id; });
    if(!t) return;
    var same = data.tasks.filter(function(x){ return x.section === t.section; });
    var idx = same.indexOf(t);
    var target = idx + dir;
    if(target < 0 || target >= same.length) return;
    var other = same[target];
    var i1 = data.tasks.indexOf(t), i2 = data.tasks.indexOf(other);
    data.tasks[i1] = other; data.tasks[i2] = t;
    render();
    pushToCloud(); // 自动同步
  }
  function copyTemplate(){
    var txt = data.feedback.template || '';
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(txt).then(function(){ toast('反馈模板已复制'); }).catch(function(){ fallbackCopy(txt); });
    }else{ fallbackCopy(txt); }
  }
  function fallbackCopy(txt){
    var ta = document.createElement('textarea');
    ta.value = txt; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    try{ document.execCommand('copy'); toast('反馈模板已复制'); }
    catch(e){ alert('复制失败，请手动复制：\n' + txt); }
    document.body.removeChild(ta);
  }

  // ================= 编辑器 =================
  var editorOnSave = null;
  function openEditor(title, bodyHTML, onSave){
    document.getElementById('editorTitle').textContent = title;
    editorBody.innerHTML = bodyHTML;
    editorOnSave = onSave;
    editorMask.classList.add('show');
    document.body.style.overflow = 'hidden';
    setTimeout(function(){
      var first = editorBody.querySelector('input,textarea,select');
      if(first) first.focus();
    }, 60);
  }
  function closeEditor(){
    editorMask.classList.remove('show');
    document.body.style.overflow = '';
    editorOnSave = null;
  }
  editorMask.addEventListener('click', function(e){ if(e.target === editorMask) closeEditor(); });
  editorBody.addEventListener('click', function(e){
    var el = e.target.closest('[data-editor-act]');
    if(!el) return;
    var act = el.getAttribute('data-editor-act');
    if(act === 'cancel') closeEditor();
    if(act === 'save'){
      if(!editorOnSave) return;
      var fd = new FormData(editorBody.querySelector('form'));
      if(editorOnSave(fd) !== false){ closeEditor(); render(); pushToCloud(); }
    }
  });
  document.addEventListener('keydown', function(e){
    if(e.key === 'Escape'){
      if(editorMask.classList.contains('show')) closeEditor();
      if(document.getElementById('modalMask').classList.contains('show')) closeModal();
    }
  });

  function openTaskEditor(id){
    var isNew = !id;
    var t = isNew
      ? { id: uid(), section: 'todo', status: 'todo', title: '', desc: '', badge: '', date: '' }
      : clone(data.tasks.find(function(x){ return x.id === id; }));
    if(!t) return;
    var secOpts = data.sections.map(function(s){
      return '<option value="' + esc(s.id) + '"' + (s.id === t.section ? ' selected' : '') + '>' + esc(s.name) + '</option>';
    }).join('');
    var stOpts = [
      { v:'todo', n:'未完成' }, { v:'doing', n:'正在完成' }, { v:'done', n:'已完成' }
    ].map(function(o){
      return '<option value="' + o.v + '"' + (o.v === t.status ? ' selected' : '') + '>' + o.n + '</option>';
    }).join('');
    var body = '<form>'
      + '<label>所属分组<select name="section">' + secOpts + '</select></label>'
      + '<label>统计状态<select name="status">' + stOpts + '</select></label>'
      + '<label>标题<input name="title" value="' + esc(t.title) + '" required></label>'
      + '<label>详情<textarea name="desc">' + esc(t.desc) + '</textarea></label>'
      + '<label>徽章文字<input name="badge" value="' + esc(t.badge) + '" placeholder="留空自动：未完成 / 正在完成 / 已完成"></label>'
      + '<label>完成日期<input name="date" value="' + esc(t.date) + '" placeholder="如 2026-10-30，可留空"></label>'
      + '<div class="form-actions">'
      + '<button type="button" class="cancel" data-editor-act="cancel">取消</button>'
      + '<button type="button" class="save" data-editor-act="save">保存</button>'
      + '</div></form>';
    openEditor(isNew ? '添加任务' : '编辑任务', body, function(fd){
      var title = (fd.get('title') || '').trim();
      if(!title){ alert('标题不能为空'); return false; }
      var obj = {
        id: t.id, section: fd.get('section') || 'todo', status: fd.get('status') || 'todo',
        title: title, desc: (fd.get('desc') || '').trim(), badge: (fd.get('badge') || '').trim(), date: (fd.get('date') || '').trim()
      };
      if(isNew) data.tasks.push(obj);
      else data.tasks = data.tasks.map(function(x){ return x.id === obj.id ? obj : x; });
      return true;
    });
  }

  function openPageEditor(){
    var m = data.meta, fb = data.feedback, info = data.info;
    var secFields = data.sections.map(function(s){
      return '<label>分组名称（' + esc(s.id) + '）<input name="sec_' + esc(s.id) + '" value="' + esc(s.name) + '"></label>';
    }).join('');
    var infoText = info.items.map(function(it){ return it.h + '|' + it.p; }).join('\n');
    var body = '<form>'
      + '<div class="fieldset"><div class="fieldset-title">页面头部</div>'
      +   '<label>标题<input name="meta_title" value="' + esc(m.title) + '"></label>'
      +   '<label>更新日期<input name="meta_date" value="' + esc(m.date) + '"></label>'
      +   '<label>服务器状态<select name="meta_status">'
      +     '<option value="online"' + (m.serverStatus === 'online' ? ' selected' : '') + '>正常开放</option>'
      +     '<option value="updating"' + (m.serverStatus === 'updating' ? ' selected' : '') + '>指令更新中</option>'
      +     '<option value="maintenance"' + (m.serverStatus === 'maintenance' ? ' selected' : '') + '>维护中</option>'
      +   '</select></label>'
      +   '<label>状态文字<input name="meta_status_text" value="' + esc(m.serverStatusText) + '"></label>'
      +   '<label>状态备注<input name="meta_status_note" value="' + esc(m.serverStatusNote) + '"></label>'
      +   '<label>页脚文字<input name="meta_footer" value="' + esc(m.footer) + '"></label>'
      + '</div>'
      + '<div class="fieldset"><div class="fieldset-title">反馈卡</div>'
      +   '<label>卡片标题<input name="fb_title" value="' + esc(fb.title) + '"></label>'
      +   '<label>置顶徽章文字<input name="fb_badge" value="' + esc(fb.badge) + '" placeholder="留空则不显示"></label>'
      +   '<label>引导语<textarea name="fb_lead">' + esc(fb.lead) + '</textarea></label>'
      +   '<label>步骤（每行一步）<textarea name="fb_steps" rows="5">' + esc(fb.steps.join('\n')) + '</textarea></label>'
      +   '<label>底部备注<textarea name="fb_note">' + esc(fb.note) + '</textarea></label>'
      +   '<label>反馈模板<textarea name="fb_template" rows="5">' + esc(fb.template) + '</textarea></label>'
      + '</div>'
      + '<div class="fieldset"><div class="fieldset-title">分组名称</div>' + secFields + '</div>'
      + '<div class="fieldset"><div class="fieldset-title">说明卡</div>'
      +   '<label>标题<input name="info_title" value="' + esc(info.title) + '"></label>'
      +   '<label>说明条目（每行一条，格式：标题|内容）<textarea name="info_items" rows="6">' + esc(infoText) + '</textarea></label>'
      + '</div>'
      + '<div class="form-actions">'
      + '<button type="button" class="cancel" data-editor-act="cancel">取消</button>'
      + '<button type="button" class="save" data-editor-act="save">保存</button>'
      + '</div></form>';
    openEditor('页面信息', body, function(fd){
      data.meta.title = (fd.get('meta_title') || '').trim() || '关于土豆的计划';
      data.meta.date = (fd.get('meta_date') || '').trim();
      data.meta.serverStatus = fd.get('meta_status') || 'online';
      data.meta.serverStatusText = (fd.get('meta_status_text') || '').trim();
      data.meta.serverStatusNote = (fd.get('meta_status_note') || '').trim();
      data.meta.footer = (fd.get('meta_footer') || '').trim();
      data.feedback.title = (fd.get('fb_title') || '').trim();
      data.feedback.badge = (fd.get('fb_badge') || '').trim();
      data.feedback.lead = fd.get('fb_lead') || '';
      data.feedback.steps = (fd.get('fb_steps') || '').split('\n').map(function(s){ return s.trim(); }).filter(Boolean);
      data.feedback.note = (fd.get('fb_note') || '').trim();
      data.feedback.template = fd.get('fb_template') || '';
      data.sections.forEach(function(s){
        var v = (fd.get('sec_' + s.id) || '').trim();
        if(v) s.name = v;
      });
      data.info.title = (fd.get('info_title') || '').trim() || '说明';
      data.info.items = (fd.get('info_items') || '').split('\n').map(function(line){
        var i = line.indexOf('|');
        if(i < 0) return null;
        var h = line.slice(0, i).trim(), p = line.slice(i + 1).trim();
        return h ? { h: h, p: p } : null;
      }).filter(Boolean);
      return true;
    });
  }

  // 统计弹窗
  var mask = document.getElementById('modalMask');
  var box = document.getElementById('modalBox');
  var mTitle = document.getElementById('modalTitle');
  var mCount = document.getElementById('modalCount');
  var mBody = document.getElementById('modalBody');
  var mClose = document.getElementById('modalClose');
  var lastFocus = null;
  var closeTimer = null;

  function renderList(status){
    var list = data.tasks.filter(function(t){ return statusOfTask(t) === status; });
    mTitle.textContent = LABEL[status];
    mCount.textContent = list.length + ' 项';
    box.className = 'modal ' + status;
    if(!list.length){
      mBody.innerHTML = '<div class="m-empty"><span class="emo">🗂️</span>' + EMPTY[status] + '</div>';
      return;
    }
    mBody.innerHTML = list.map(function(t){
      var sec = data.sections.find(function(s){ return s.id === t.section; });
      return '<div class="m-item"><span class="m-dot"></span><div class="m-text">'
        + '<span class="m-title">' + esc(t.title) + '</span>'
        + '<span class="m-cat">' + esc(sec ? sec.name : t.section) + '</span>'
        + '</div></div>';
    }).join('');
    mBody.scrollTop = 0;
  }
  function openModal(status){
    clearTimeout(closeTimer);
    lastFocus = document.activeElement;
    renderList(status);
    mask.classList.add('show');
    mask.setAttribute('aria-hidden', 'false');
    document.body.style.overflow = 'hidden';
    requestAnimationFrame(function(){ requestAnimationFrame(function(){ mask.classList.add('in'); }); });
    setTimeout(function(){ mClose.focus(); }, 80);
  }
  function closeModal(){
    mask.classList.remove('in');
    mask.setAttribute('aria-hidden', 'true');
    document.body.style.overflow = '';
    closeTimer = setTimeout(function(){ mask.classList.remove('show'); }, 300);
    if(lastFocus && lastFocus.focus) lastFocus.focus();
  }
  mClose.addEventListener('click', closeModal);
  mask.addEventListener('click', function(e){ if(e.target === mask) closeModal(); });

  function checkAdmin(){
    if(sessionStorage.getItem('potato-admin') === '1') return true;
    var p = prompt('请输入管理密码：');
    if(p === CONFIG.adminPassword){
      sessionStorage.setItem('potato-admin', '1');
      return true;
    }
    if(p !== null) alert('密码错误');
    return false;
  }
  function exitEdit(){
    if(confirm('退出编辑模式？')) location.href = location.pathname;
  }

  async function init(){
    data = clone(window.__POTATO_DATA__);

    var params = new URLSearchParams(location.search);
    editMode = params.get('edit') === '1';
    if(editMode && !checkAdmin()) editMode = false;
    if(editMode){
      history.replaceState(null, '', location.pathname + location.hash);
    }

    render();
    await initCloud();
  }
  
  init();
})();
</script>
</body>
</html>
